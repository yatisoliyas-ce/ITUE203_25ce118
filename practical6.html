
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Practical 6</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .practical6-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .practical6-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .practical6-controls input,
        .practical6-controls select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font: inherit;
        }

        .practical6-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .practical6-card {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow-wrap: anywhere;
        }

        .practical6-card h3 {
            margin-top: 0;
        }

        .practical6-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 25px 0;
        }

        .practical6-pagination button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .practical6-pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #loading,
        #error {
            margin: 20px 0;
        }

        #error {
            color: #c62828;
        }

        @media (max-width: 480px) {
            .practical6-container {
                margin: 15px auto;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <main class="practical6-container">
        <h1>StudentHub Data Explorer</h1>
        <p>Explore events, student profiles, and frequently asked questions.</p>

        <div class="practical6-controls">
            <select id="dataset-select" aria-label="Choose dataset">
                <option value="events">Events</option>
                <option value="students">Students</option>
                <option value="faqs">FAQs</option>
            </select>

            <input
                type="search"
                id="search-input"
                placeholder="Search records..."
                aria-label="Search records"
            >

            <select id="category-filter" aria-label="Filter by category">
                <option value="all">All Categories</option>
            </select>

            <select id="sort-select" aria-label="Sort records">
                <option value="asc">Sort A to Z</option>
                <option value="desc">Sort Z to A</option>
            </select>
        </div>

        <p id="loading" role="status">Loading data...</p>
        <p id="error" role="alert" style="display: none;"></p>
        <p id="result-count" aria-live="polite">Loading records...</p>

        <section id="data-list" class="practical6-grid" aria-label="Data results"></section>

        <div class="practical6-pagination">
            <button type="button" id="previous-page" disabled>Previous</button>
            <span id="page-info" aria-live="polite">Page 1 of 1</span>
            <button type="button" id="next-page" disabled>Next</button>
        </div>

        <p><a href="index.html">Back to StudentHub Home</a></p>
    </main>

    <script src="practical6.js"></script>
</body>
</html>
